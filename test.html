<!DOCTYPE html>
<html>
<head>
<title>W3.CSS Template</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oswald">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open Sans">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
h1,h2,h3,h4,h5,h6 {font-family: "Oswald"}
body {font-family: "Open Sans"}
</style>
</head>
<body class="w3-light-grey">
  
<!-- w3-content defines a container for fixed size centered content, 
and is wrapped around the whole page content, except for the footer in this example -->
<div class="w3-content" style="max-width:1600px">

  <!-- Header -->
  <header class="w3-container w3-center w3-padding-48 w3-white">
    <h1 class="w3-xxxlarge"><b>FPL <span class="w3-tag">GUI</span></b></h1>
    <h6>Max Winokan</h6>
  </header>

  <!-- Grid -->
  <div class="w3-row w3-padding w3-border">

    <!-- Content -->
    <div class="w3-col l8 s12">
      <div class="w3-container w3-white w3-margin w3-padding-large">
        <div class="w3-center">
          <h3>HOME PAGE</h3>
        </div>
        <div class="w3-justify">
          <p> MARKDOWN CONTENT GOES HERE </p>
        </div>
      </div>
      <hr>
    </div>

    <!-- Sidebar -->
    <div class="w3-col l4">
      <div class="w3-white w3-margin">
        <div class="w3-container w3-black">
          <h4>FPL_GUI</h4>
          <p>LINKS TO PAGES GO HERE</p>
        </div>
      </div>
      <hr>
    </div>

  <!-- END GRID -->
  </div>

<!-- END w3-content -->
</div>

<!-- Footer -->
<footer class="w3-container w3-dark-grey" style="padding:32px">
  <a href="#" class="w3-button w3-black w3-padding-large w3-margin-bottom"><i class="fa fa-arrow-up w3-margin-right"></i>Back to top</a>
  <div class="w3-center">
    <p>Max Winokan <span class="w3-tag">mwinokan@me.com</span></a></p>
  </div>
</footer>

</body>
</html>
